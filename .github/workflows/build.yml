name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute version tag
        id: meta
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          RAW_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          BRANCH=$(echo "${RAW_BRANCH}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9.-]/-/g' | sed 's/^-*//;s/-*$//')
          VERSION="1.${COMMIT_COUNT}-${BRANCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION}"

      - name: Parse registry host
        id: registry
        env:
          DOCKER_PUSH_URL: ${{ vars.DOCKER_PUSH_URL }}
          DOCKER_PUSH_USERNAME: ${{ secrets.DOCKER_PUSH_USERNAME }}
        run: |
          if [ -z "${DOCKER_PUSH_URL}" ]; then
            echo "DOCKER_PUSH_URL variable is not set" >&2
            exit 1
          fi
          HOST="${DOCKER_PUSH_URL%%/*}"
          case "${DOCKER_PUSH_URL}" in
            */*) PREFIX="${DOCKER_PUSH_URL}" ;;
            *)   PREFIX="${DOCKER_PUSH_URL}/${DOCKER_PUSH_USERNAME}" ;;
          esac
          echo "host=${HOST}" >> "$GITHUB_OUTPUT"
          echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.20.2

      - name: Resolve upstream versions
        id: upstream
        run: |
          APP_VERSION=$(awk '/^appVersion:/ {gsub(/"/,"",$2); print $2}' helm/sealed-secrets-web/Chart.yaml)
          CHART_VERSION=$(awk '/^  - name: sealed-secrets-web$/{f=1} f && /^    version:/ {print $2; exit}' helm/sealed-secrets-web/Chart.yaml)
          if [ -z "${APP_VERSION}" ] || [ -z "${CHART_VERSION}" ]; then
            echo "Could not parse versions from Chart.yaml" >&2
            exit 1
          fi
          echo "image_tag=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${APP_VERSION}, chart version: ${CHART_VERSION}"

      - uses: docker/setup-buildx-action@v4

      - name: Login to registry (docker)
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.DOCKER_PUSH_USERNAME }}
          password: ${{ secrets.DOCKER_PUSH_PASSWORD }}

      - name: Login to registry (helm)
        env:
          HELM_REGISTRY_USERNAME: ${{ secrets.DOCKER_PUSH_USERNAME }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.DOCKER_PUSH_PASSWORD }}
        run: |
          echo "${HELM_REGISTRY_PASSWORD}" | helm registry login \
            --username "${HELM_REGISTRY_USERNAME}" \
            --password-stdin \
            "${{ steps.registry.outputs.host }}"

      - name: Mirror upstream image to our registry
        run: |
          SRC="ghcr.io/bakito/sealed-secrets-web:${{ steps.upstream.outputs.image_tag }}"
          DST="${{ steps.registry.outputs.prefix }}/sealed-secrets-web:${{ steps.upstream.outputs.image_tag }}"
          docker buildx imagetools create -t "${DST}" "${SRC}"
          echo "Mirrored ${SRC} -> ${DST}"

      - name: Mirror upstream chart to our registry
        run: |
          CHART_VERSION="${{ steps.upstream.outputs.chart_version }}"
          helm repo add bakito https://charts.bakito.net
          helm pull bakito/sealed-secrets-web --version "${CHART_VERSION}" -d /tmp
          helm push "/tmp/sealed-secrets-web-${CHART_VERSION}.tgz" \
            "oci://${{ steps.registry.outputs.prefix }}"
          echo "Mirrored chart sealed-secrets-web ${CHART_VERSION} -> oci://${{ steps.registry.outputs.prefix }}"

      - name: Build Helm dependencies
        run: helm dependency build helm/sealed-secrets-web

      - name: Lint Helm chart
        run: helm lint helm/sealed-secrets-web

      - name: Render Helm chart (smoke test)
        run: |
          helm template test helm/sealed-secrets-web \
            --set gatewayApi.enabled=true \
            --set gatewayApi.hostedZoneName=example.com \
            > /tmp/rendered.yaml
          head -n 20 /tmp/rendered.yaml

      - name: Package and push umbrella chart
        run: |
          # Push the umbrella under a separate name so the OCI artifact does
          # not collide with the mirrored container image at
          # docker.io/{user}/sealed-secrets-web. Chart name in OCI comes from
          # Chart.yaml's `name`, so rewrite it in a copy.
          cp -r helm/sealed-secrets-web /tmp/sealed-secrets-web-helm
          sed -i 's/^name: sealed-secrets-web$/name: sealed-secrets-web-helm/' \
            /tmp/sealed-secrets-web-helm/Chart.yaml
          helm package /tmp/sealed-secrets-web-helm \
            --version "${{ steps.meta.outputs.version }}" \
            --app-version "${{ steps.upstream.outputs.image_tag }}" \
            -d /tmp
          helm push /tmp/sealed-secrets-web-helm-${{ steps.meta.outputs.version }}.tgz \
            oci://${{ steps.registry.outputs.prefix }}
